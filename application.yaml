apiVersion: v1
kind: Namespace
metadata:
  name: orchestrator
---
# Le Secret "orchestrator-db" n'est plus ici : il vit dans secret.local.yaml,
# jamais commité (voir .gitignore), appliqué à part avec :
#   kubectl apply -f secret.local.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-api
  namespace: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-api
  template:
    metadata:
      labels:
        app: orchestrator-api
    spec:
      # Le registre Gitea est privé : sans ce secret, le kubelet tire en
      # anonyme et reçoit un 401. Il doit figurer ICI, dans le manifeste que
      # synchronise Argo CD, et pas seulement dans le cluster : Argo CD fait
      # foi, il remettrait sinon sa version d'origine au prochain sync.
      #   kubectl -n orchestrator create secret docker-registry gitea-registry       #     --docker-server=host.docker.internal:3000       #     --docker-username=<compte> --docker-password=<jeton read:package>
      imagePullSecrets:
        - name: gitea-registry
      containers:
        - name: orchestrator-api
          # Doit correspondre à REGISTRY_URL/GITEA_OWNER du Jenkinsfile (racine).
          # RELEASE_TAG est remplacé par le SHA approuvé à chaque déploiement
          # (commit [skip ci] de Hadi sur ce fichier), jamais `latest`.
          image: host.docker.internal:3000/didier/orchestrator:RELEASE_TAG
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: orchestrator-db
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-api
  namespace: orchestrator
spec:
  selector:
    app: orchestrator-api
  ports:
    - port: 8000
      targetPort: 8000
