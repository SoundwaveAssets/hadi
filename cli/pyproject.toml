[project]
name = "hadi-cli"
version = "0.1.0"
description = "Client en ligne de commande pour Hadi, passerelle de décision CI/CD"
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer==0.27.2",
    "rich==15.0.0",
    "httpx==0.27.0",
    "shellingham==1.5.4",
    "keyring==25.6.0",
    "platformdirs==4.3.8",
]

[project.scripts]
hadi = "hadi.app:app"

[tool.setuptools]
packages = ["hadi", "hadi.commands"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
